# fly.toml app configuration file generated for shipboard-test-server on 2026-11-01T04:30:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shipboard-test-server'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
